plugins {
    id "com.android.application"
}

// Версия приложения тянется из desktop/package.json, чтобы все клиенты
// Sazcord (win/mac/linux/android) шли одной версией и не разъезжались.
def pkgFile = file("${rootDir}/../../desktop/package.json")
def pkgVersion = new groovy.json.JsonSlurper().parseText(pkgFile.text).version
// versionCode должен монотонно расти. Схема major*10000 + minor*100 + patch
// даёт 0.9.3 -> 903, 1.0.0 -> 10000. Хватит до major 214.
def (vMajor, vMinor, vPatch) = pkgVersion.tokenize('.').collect { it.toInteger() }
def code = vMajor * 10000 + vMinor * 100 + vPatch

android {
    namespace "vip.sazcord.app"
    compileSdk 35

    defaultConfig {
        applicationId "vip.sazcord.app"
        minSdk 24
        targetSdk 35
        versionCode code
        versionName pkgVersion
        // Адреса сервера по умолчанию здесь намеренно НЕТ. Сборка одна на
        // всех, а сервер у каждого свой: при первом запуске приложение
        // спрашивает адрес (MainActivity.showSetupPage) и кладёт его в
        // SharedPreferences, где он переживает обновления. Сменить или
        // выйти можно из настроек клиента.
    }

    buildFeatures {
        buildConfig true
    }

    signingConfigs {
        release {
            // Ключ лежит вне репозитория. Путь и пароли берём из
            // gradle.properties или переменных окружения — чтобы keystore
            // случайно не уехал в git.
            def storePathValue = System.getenv("SAZCORD_KEYSTORE") ?: (project.findProperty("sazcordKeystore") ?: "")
            if (storePathValue) {
                storeFile file(storePathValue)
                storePassword System.getenv("SAZCORD_KEYSTORE_PASSWORD") ?: project.findProperty("sazcordKeystorePassword")
                keyAlias System.getenv("SAZCORD_KEY_ALIAS") ?: project.findProperty("sazcordKeyAlias")
                keyPassword System.getenv("SAZCORD_KEY_PASSWORD") ?: project.findProperty("sazcordKeyPassword")
            }
        }
    }

    buildTypes {
        release {
            // minify выключен намеренно: кода почти нет, а R8 ломал бы
            // @JavascriptInterface-мосты без дополнительных keep-правил.
            minifyEnabled false
            def ks = System.getenv("SAZCORD_KEYSTORE") ?: (project.findProperty("sazcordKeystore") ?: "")
            if (ks) {
                signingConfig signingConfigs.release
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

// Транзитивные зависимости androidx тянут и новый kotlin-stdlib, и старые
// расколотые kotlin-stdlib-jdk7/jdk8 (1.6.x). Начиная с Kotlin 1.8 их
// содержимое влито в основной stdlib, поэтому вместе они дают
// «Duplicate class kotlin.io.path.PathsKt …» и сборка падает на
// checkDuplicateClasses. Выкидываем легаси-артефакты и фиксируем версию.
configurations.configureEach {
    exclude group: "org.jetbrains.kotlin", module: "kotlin-stdlib-jdk7"
    exclude group: "org.jetbrains.kotlin", module: "kotlin-stdlib-jdk8"
    resolutionStrategy {
        force "org.jetbrains.kotlin:kotlin-stdlib:1.9.24"
    }
}

dependencies {
    implementation "androidx.appcompat:appcompat:1.7.0"
    implementation "androidx.core:core:1.13.1"
}
